<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>THIGAS AI // Terminal</title>
<style>
:root{--bg:#08090b;--fg:#d7d9df;--dim:#747982;--blue:#7aa7ff;--pink:#d98ab8;--green:#82c995;--red:#ff7373;--yellow:#e8c875;--panel:#101216;--border:#252931}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}button,input,select,textarea{font:inherit}
body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:#090a0c}.brand{font-weight:700;color:var(--fg)}.brand b{color:var(--blue)}.topright{display:flex;gap:7px;align-items:center}.top button,.top select{background:#111318;border:1px solid var(--border);color:var(--fg);border-radius:7px;height:32px;padding:0 9px}.top select{max-width:190px}
main{flex:1;min-height:0;display:flex}.terminal{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 24px 0}.output{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word}.logo{font-size:clamp(38px,9vw,92px);line-height:.76;font-weight:900;letter-spacing:-.12em;background:linear-gradient(90deg,#5f9cff,#9d83ec,#d58caf);-webkit-background-clip:text;color:transparent;margin:10px 0 30px}.tip{color:var(--dim);line-height:1.55;margin:5px 0}.tip strong{color:#aeb3bc}.promptline{display:flex;align-items:flex-start;gap:10px;margin:22px 0 12px}.promptmark{color:var(--blue);font-weight:bold}.promptbox{flex:1;border:1px solid #39404a;background:#0d0f13;border-radius:8px;padding:9px 12px;min-height:43px;display:flex}.promptbox textarea{width:100%;resize:none;background:transparent;border:0;outline:0;color:var(--fg);min-height:23px;max-height:150px}.send{border:0;background:transparent;color:var(--blue);font-size:20px;cursor:pointer}.status{display:flex;justify-content:space-between;gap:12px;color:var(--dim);padding:9px 0 12px;border-top:1px solid var(--border);font-size:12px}.status .active{color:var(--pink)}.status .ok{color:var(--green)}
.side{width:330px;border-left:1px solid var(--border);background:#0c0e11;overflow:auto;padding:14px}.section{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:14px}.title{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.engine{border:1px solid var(--border);padding:9px;border-radius:7px;margin:6px 0;background:#101217;cursor:pointer}.engine:hover,.engine.sel{border-color:var(--blue)}.ename{font-size:13px}.etype{font-size:10px;color:var(--dim);margin-top:3px}.field{margin:8px 0}.field label{display:block;color:var(--dim);font-size:10px;margin-bottom:4px}.field input,.field select{width:100%;height:34px;background:#111318;border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.action{background:#111318;color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px}.memory{max-height:150px;overflow:auto}.memory div{font-size:11px;padding:6px;border-bottom:1px dotted var(--border);color:#aeb3bc}
#chat{margin-top:10px}.line{margin:9px 0}.u{color:var(--yellow)}.a{color:var(--green)}.e{color:var(--red)}.s{color:var(--blue)}
@media(max-width:800px){.side{display:none}.terminal{padding:14px 12px 0}.logo{font-size:clamp(34px,12vw,60px);margin:9px 0 20px}.top{height:48px}.top select{max-width:150px}.status{font-size:10px}.promptline{margin-top:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><b>✦</b> THIGAS AI <span style="color:var(--dim)">// terminal</span></div>
<div class="topright"><select id="engine" aria-label="Motor"><option value="auto">AUTO</option><option value="llamacpp">LLAMA.CPP / GGUF</option><option value="ollama">OLLAMA LOCAL</option><option value="ollamacloud">OLLAMA CLOUD</option><option value="lmstudio">LM STUDIO</option><option value="koboldcpp">KOBOLDCPP / GGUF</option><option value="localai">LOCALAI</option><option value="jan">JAN</option><option value="ollamacloudapi">OLLAMA CLOUD API</option><option value="openrouter">OPENROUTER</option><option value="custom">CUSTOM API</option></select><button id="sideBtn">☰</button></div>
</header>
<main>
<section class="terminal">
<div id="output" class="output">
<div class="logo">THIGAS<br>AI</div>
<div class="tip">Dicas para começar:</div>
<div class="tip">1. <strong>/help</strong> para ver os comandos.</div>
<div class="tip">2. Faça perguntas, escreva código ou peça análise.</div>
<div class="tip">3. Seja específico para obter melhores resultados.</div>
<div id="chat"></div>
</div>
<div class="promptline"><span class="promptmark">›</span><div class="promptbox"><textarea id="prompt" rows="1" placeholder="Digite sua mensagem ou /help"></textarea><button class="send" id="send">↵</button></div></div>
<div class="status"><span id="cwd">~/thigasai</span><span id="state">aguardando</span><span id="model">modelo padrão</span></div>
</section>
<aside class="side" id="side">
<div class="section"><div class="title">Motores</div><div id="engines"></div></div>
<div class="section"><div class="title">Configuração do motor</div>
<div class="field"><label>ENDPOINT</label><input id="endpoint" placeholder="http://127.0.0.1:8080/v1"></div>
<div class="field"><label>MODELO / ALIAS</label><input id="modelName" placeholder="qwen2.5-coder:1.5b"></div>
<div class="field"><label>CHAVE (opcional; não necessária para Ollama local/cloud)</label><input id="apiKey" type="password" placeholder="não obrigatória"></div>
<div class="grid"><button class="action" id="saveCfg">Salvar</button><button class="action" id="test">Testar</button></div><button class="action" id="diagnose" style="width:100%;margin-top:6px">Diagnosticar conexão</button></div>
<div class="section"><div class="title">Memória</div><div id="memory" class="memory"></div><div class="grid" style="margin-top:7px"><button class="action" id="remember">Salvar contexto</button><button class="action" id="forget">Limpar</button></div></div>
<div class="section"><div class="title">Sessão</div><div class="grid"><button class="action" id="clear">Limpar chat</button><button class="action" id="export">Exportar memória</button></div></div>
</aside>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
const KEYS={mem:"thigasai.mem.v3",chat:"thigasai.chat.v3",cfg:"thigasai.cfg.v3"};
const defs={
llamacpp:["Llama.cpp","GGUF / OpenAI-compatible","http://127.0.0.1:8080/v1","local"],
ollama:["Ollama Local","modelos locais","http://127.0.0.1:11434","qwen2.5-coder:1.5b"],
ollamacloud:["Ollama Cloud","nuvem via Ollama local","http://localhost:11434","gpt-oss:20b-cloud"],
ollamacloudapi:["Ollama Cloud API","nuvem HTTPS / API key","https://ollama.com","gpt-oss:20b-cloud"],
lmstudio:["LM Studio","modelos locais","http://127.0.0.1:1234/v1",""],
koboldcpp:["KoboldCpp","GGUF / geração","http://127.0.0.1:5001",""],
localai:["LocalAI","modelos locais","http://127.0.0.1:8080/v1",""],
jan:["Jan","modelos locais","http://127.0.0.1:1337/v1",""],
openrouter:["OpenRouter","online / OpenAI-compatible","https://openrouter.ai/api/v1",""],
custom:["Custom API","OpenAI-compatible","", ""]
};
const cfg=JSON.parse(localStorage.getItem(KEYS.cfg)||"{}");let mem=JSON.parse(localStorage.getItem(KEYS.mem)||"[]");let history=JSON.parse(localStorage.getItem(KEYS.chat)||"[]");
const engine=$("#engine");
function active(){return engine.value==="auto"?"llamacpp":engine.value}
function endpoint(id){let v=(cfg[id]?.endpoint??defs[id][2]??"").trim().replace(/\/$/,"");if(id==="ollamacloud"&&(!v||v==="http://127.0.0.1:11434"))v="http://localhost:11434";if(id==="ollamacloudapi"&&(!v||v==="https://ollama.com"))v="https://ollama.com";return v}
function localId(id){return ["llamacpp","ollama","ollamacloud","lmstudio","koboldcpp","localai","jan"].includes(id)}
async function fetchWithTimeout(url,opt={},ms=9000){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);try{return await fetch(url,{...opt,signal:ctl.signal})}finally{clearTimeout(tm)}}
function errText(e,id){if(e?.name==="AbortError")return "Tempo esgotado ao conectar em "+endpoint(id);if(e?.message==="Failed to fetch"||e instanceof TypeError)return "Não foi possível conectar. Verifique Ollama/CORS e acesso à rede local.";if(/^HTTP 404$/.test(e?.message||""))return "HTTP 404: o endpoint /api/chat não encontrou o recurso. No Ollama Cloud confirme o modelo exatamente como gpt-oss:20b-cloud.";return e?.message||String(e)}
function saveAll(){localStorage.setItem(KEYS.cfg,JSON.stringify(cfg));localStorage.setItem(KEYS.mem,JSON.stringify(mem.slice(-100)));localStorage.setItem(KEYS.chat,JSON.stringify(history.slice(-100)));renderMem()}
function settings(){let id=active(),d=defs[id],c=cfg[id]||{};$("#endpoint").value=c.endpoint??d[2];$("#modelName").value=c.model??d[3];$("#apiKey").value=c.key??"";$("#model").textContent=$("#modelName").value||"modelo padrão";document.querySelectorAll(".engine").forEach(x=>x.classList.toggle("sel",x.dataset.id===id))}
function buildEngines(){let b=$("#engines");b.innerHTML=Object.entries(defs).map(([id,d])=>'<div class="engine" data-id="'+id+'"><div class="ename">'+d[0]+'</div><div class="etype">'+d[1]+'</div></div>').join("");b.querySelectorAll(".engine").forEach(x=>x.onclick=()=>{engine.value=x.dataset.id;settings()})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function print(t,c="s"){let e=document.createElement("div");e.className="line "+c;e.textContent=t;$("#chat").appendChild(e);$("#output").scrollTop=$("#output").scrollHeight}
function renderMem(){$("#memory").innerHTML=mem.length?mem.slice().reverse().map(x=>"<div>"+esc(x.text)+"</div>").join(""):"<div>nenhuma memória salva</div>"}
function context(){return mem.slice(-20).map(x=>x.text).join("\n")}
function addHistory(role,text){history.push({role,content:text});saveAll()}
function restore(){history.forEach(x=>print((x.role==="user"?"› ":"THIGAS › ")+x.content,x.role==="user"?"u":"a"));renderMem()}
function learn(t){const rs=[/\bmeu nome é\s+(.+)/i,/\bmoro em\s+(.+)/i,/\bmeu projeto é\s+(.+)/i,/\bminha preferência é\s+(.+)/i];rs.forEach(r=>{let m=t.match(r);if(m&&!mem.some(x=>x.text.toLowerCase()===m[0].trim().toLowerCase()))mem.push({text:m[0].trim(),at:Date.now()})})}
function base(id){let c=cfg[id]||{},d=defs[id];return c.endpoint??d[2]}
function name(id){return (cfg[id]?.model??defs[id][3])||"local"}
async function openaiLike(text,id){let ep=endpoint(id),key=cfg[id]?.key||"",h={"Content-Type":"application/json"};if(key)h.Authorization="Bearer "+key;let r=await fetchWithTimeout(ep+"/chat/completions",{method:"POST",headers:h,body:JSON.stringify({model:name(id)||"local",messages:[{role:"system",content:"Você é THIGAS AI. Responda em português do Brasil. Seja preciso. Memória relevante:\n"+context()},{role:"user",content:text}],temperature:.3,max_tokens:700})});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();return j.choices?.[0]?.message?.content||"Sem resposta."}
async function ollama(text,id="ollama"){let h={"Content-Type":"application/json"};if(cfg[id]?.key)h.Authorization="Bearer "+cfg[id].key;let r=await fetchWithTimeout(endpoint(id)+"/api/chat",{method:"POST",headers:h,body:JSON.stringify({model:name(id)||"llama3.2",messages:[{role:"system",content:"Você é THIGAS AI. Memória:\n"+context()},{role:"user",content:text}],stream:false})});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();return j.message?.content||"Sem resposta."}
async function kobold(text){let id="koboldcpp",r=await fetchWithTimeout(endpoint(id)+"/api/v1/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:"Você é THIGAS AI. Memória:\n"+context()+"\nUsuário: "+text+"\nTHIGAS AI:",max_length:700,temperature:.3})});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();return j.results?.[0]?.text||"Sem resposta."}
async function ask(t){let id=engine.value;$("#state").textContent="conectando";$("#state").className="active";if(id==="auto"){const order=["llamacpp","ollama","ollamacloud","lmstudio","koboldcpp","localai","jan"];let last="";for(const x of order){try{let out=(x==="ollama"||x==="ollamacloud"||x==="ollamacloudapi")?await ollama(t,x):x==="koboldcpp"?await kobold(t):await openaiLike(t,x);$("#state").textContent="online · "+defs[x][0];$("#state").className="ok";engine.value=x;settings();return out}catch(e){last=errText(e,x)}}$("#state").textContent="offline";$("#state").className="e";return "Nenhum runtime local respondeu.\n\nInicie o llama.cpp no Termux ou selecione outro motor.\nUse /termux para ver o comando recomendado."}try{let out=(id==="ollama"||id==="ollamacloud"||id==="ollamacloudapi")?await ollama(t,id):id==="koboldcpp"?await kobold(t):await openaiLike(t,id);$("#state").textContent="online · "+defs[id][0];$("#state").className="ok";return out}catch(e){$("#state").textContent="offline";$("#state").className="e";return "ERRO: "+errText(e,id)+"\n\nUse 'Diagnosticar conexão' para testar o endpoint. GGUF precisa de um runtime como llama.cpp, KoboldCpp ou Ollama."}}
async function send(){let t=$("#prompt").value.trim();if(!t)return;$("#prompt").value="";resize();if(t==="/help"){print("/help  /memory  /clear  /engine  /forget  /termux","s");return}if(t==="/termux"){print("Ollama Cloud API: use OLLAMA CLOUD API + https://ollama.com + sua chave no campo CHAVE.\n\nllama.cpp no Termux:\ncd ~/llama.cpp\n./build/bin/llama-server -m ~/SEU_MODELO.gguf --host 127.0.0.1 --port 8080 --alias qwen-local --ctx-size 4096 --cors-origins https://thiagollipe-web.github.io\n\nOllama Cloud via celular:\nollama signin\nollama run gpt-oss:20b-cloud\n\nDepois, no THIGAS: OLLAMA CLOUD · http://127.0.0.1:11434 · gpt-oss:20b-cloud","s");return}if(t==="/clear"){history=[];saveAll();$("#chat").innerHTML="";return}if(t==="/memory"){print("Memórias: "+(mem.length?mem.map(x=>x.text).join(" | "):"nenhuma"),"s");return}print("› "+t,"u");addHistory("user",t);learn(t);saveAll();print("THIGAS › processando...","a");let lines=$("#chat").lastElementChild;let out=await ask(t);lines.textContent="THIGAS › "+out;history.push({role:"assistant",content:out});saveAll()}
function resize(){let x=$("#prompt");x.style.height="auto";x.style.height=Math.min(x.scrollHeight,150)+"px"}
async function diagnose(){let ids=engine.value==="auto"?["llamacpp","ollama","lmstudio","koboldcpp","localai","jan"]:[active()];print("[diagnóstico] iniciando...","s");for(const id of ids){try{let u=(id==="ollama"||id==="ollamacloud")?endpoint(id)+"/api/tags":id==="ollamacloudapi"?endpoint(id)+"/api/tags":id==="koboldcpp"?endpoint(id)+"/api/v1/model":endpoint(id)+"/models";let r=await fetchWithTimeout(u,{headers:cfg[id]?.key?{Authorization:"Bearer "+cfg[id].key}:{}},5000);if(r.ok){let j=await r.json().catch(()=>({}));print("[OK] "+defs[id][0]+" · "+endpoint(id),"a");if(j.data?.length)print("modelos: "+j.data.map(x=>x.id).join(", "),"s");else if(j.models?.length)print("modelos: "+j.models.map(x=>x.name||x.model).join(", "),"s");return}print("[HTTP "+r.status+"] "+defs[id][0],"e")}catch(e){print("[OFF] "+defs[id][0]+" · "+errText(e,id),"e")}}print("[dica] /termux mostra o comando llama.cpp para este site.","s")}
$("#prompt").oninput=resize;$("#prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#send").onclick=send;$("#diagnose").onclick=diagnose;
engine.onchange=settings;$("#saveCfg").onclick=()=>{let id=active();cfg[id]={endpoint:$("#endpoint").value.trim(),model:$("#modelName").value.trim(),key:$("#apiKey").value};saveAll();settings();print("[config] "+defs[id][0]+" salvo","s")};
$("#test").onclick=async()=>{print("[teste] "+defs[active()][0]+"...","s");let r=await ask("Responda apenas: OK");print("[teste] "+r,"a")};
$("#remember").onclick=()=>{let t=$("#prompt").value.trim();if(t){mem.push({text:t,at:Date.now()});$("#prompt").value="";resize();saveAll();print("[memória] contexto salvo","s")}};
$("#forget").onclick=()=>{mem=[];saveAll();print("[memória] limpa","s")};
$("#clear").onclick=()=>{$("#chat").innerHTML="";history=[];saveAll()};
$("#export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(mem,null,2)],{type:"application/json"}));a.href=u;a.download="thigas-memory.json";a.click();URL.revokeObjectURL(u)};
$("#sideBtn").onclick=()=>{$("#side").style.display=$("#side").style.display==="none"?"block":"none"};
buildEngines();settings();restore();
</script>
</body>
</html>
